[project]
name = "runlens"
version = "0.4.0"
description = "Filesystem-first artifact protocol and CLI for coding agents."
readme = "README.md"
authors = [
    { name = "WayneZcode", email = "87684399+WaynezProg@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.6",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "typer>=0.26.7",
    "vl-convert-python>=1.9.0.post1",
]

[project.scripts]
runlens = "runlens.cli:app"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
